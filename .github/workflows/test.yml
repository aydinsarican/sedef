name: test

on:
  push:
  pull_request:

jobs:
  runner:
    name: runner tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: validate the shipped config
        run: node dist/src/cli.js validate-config
        env:
          SEDEF_HOME: ${{ github.workspace }}

  scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x install.sh scripts/*.sh plugin/hooks/guard.sh bin/sedef templates/*/.sedef/verify.sh
